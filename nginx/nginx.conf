# nginx load balancer for scaled langfuse-web replicas.
# tuned for load testing: high connection ceiling, keepalive, generous timeouts.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    worker_connections  16384;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # log includes upstream so you can confirm distribution across replicas during load tests
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time upstream=$upstream_addr';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    # client-side keepalive: critical for load testing throughput
    keepalive_timeout   75s;
    keepalive_requests  10000;

    # langfuse uses signed urls + jwt cookies — bump header buffers above the 8k default
    large_client_header_buffers 4 32k;
    client_header_timeout 30s;
    client_body_timeout   30s;
    client_max_body_size  50m;
    client_body_buffer_size 256k;
    send_timeout 60s;

    # gzip ui assets and json api responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # docker's embedded dns. valid=5s so `--scale` up/down is picked up fast without restart.
    # for heavier load testing set valid=1s to spread requests more evenly across replicas.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80 default_server backlog=4096;
        server_name _;

        # nginx-local health endpoint for probes (does NOT proxy to backends)
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            # variable proxy_pass forces nginx to re-resolve via docker dns on cache expiry,
            # so new replicas from `docker compose --scale` are picked up automatically.
            # static `upstream { server langfuse-web:3000; }` would only resolve at startup
            # and pin to the first ip forever — wrong for this use case.
            set $upstream_web "http://langfuse-web:3000";
            proxy_pass $upstream_web;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;

            proxy_redirect off;
        }
    }
}